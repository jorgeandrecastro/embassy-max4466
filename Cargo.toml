[package]
name          = "embassy-max4466"
version       = "0.2.0"
edition       = "2024"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
license       = "GPL-2.0-or-later"
description   = "Driver async no_std pour le capteur MAX4466, basé sur Embassy."
repository    = "https://github.com/yourname/embassy-max4466"
documentation = "https://docs.rs/embassy-max4466"
readme        = "README.md"
keywords      = ["embassy", "max4466", "microphone", "no-std", "embedded"]
categories    = ["embedded", "no-std", "hardware-support"]

build        = false
autolib      = false
autobins     = false
autoexamples = false
autotests    = false
autobenches  = false

[lib]
name = "embassy_max4466"
path = "src/lib.rs"

[features]
default = []
filter-ema    = []
filter-median = []

[dependencies]
embassy-time = "0.5"
embassy-sync = "0.8"

# embedded-hal uniquement pour le trait abstrait AdcChannel si nécessaire
# Le driver cible directement embassy-rp/embassy-stm32 via généricité

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true